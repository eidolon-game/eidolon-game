name: EIDOLON CI
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate project manifest and source
        run: python3 scripts/validate_source.py
  windows-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check for Unreal Engine and disk capacity
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem
          $engines = @(Get-ChildItem 'C:\Program Files\Epic Games' -Directory -ErrorAction SilentlyContinue | Where-Object { Test-Path (Join-Path $_.FullName 'Engine\Build\BatchFiles\Build.bat') })
          if ($engines.Count -eq 0) {
            Write-Host '::notice::Unreal Engine unavailable on this hosted runner. No Windows binary produced.'
            'No Unreal Engine available; source validation only.' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          } else {
            & ./scripts/Build-Editor.ps1 -EngineRoot $engines[0].FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
