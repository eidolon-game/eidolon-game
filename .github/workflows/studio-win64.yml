name: Studio Win64 verification
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  win64:
    if: github.ref == 'refs/heads/integration/studio'
    environment: studio-win64
    runs-on: [self-hosted, Windows, X64, eidolon-ue56-ephemeral]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false
          lfs: true
      - name: Compile, test and package the Arena
        shell: pwsh
        run: |
          if (-not $env:UE_ROOT) {
            throw 'Set UE_ROOT on the isolated runner to an authorized Unreal Engine 5.6 installation.'
          }
          ./scripts/build/Invoke-StudioWin64.ps1 -EngineRoot $env:UE_ROOT
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-win64-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: Saved/StudioWin64/diagnostics/
          if-no-files-found: ignore
      - name: Upload verified Arena package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-win64-arena-${{ github.sha }}-${{ github.run_attempt }}
          path: Saved/StudioWin64/delivery/
          if-no-files-found: error
          compression-level: 0
