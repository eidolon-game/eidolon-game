name: EIDOLON source validation
on:
  push:
    branches: [main, develop, 'integration/**', 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/validate_source.py
      - run: python3 scripts/build/validate_data.py
      - run: python3 -m unittest discover -s scripts/build -p 'test_*.py'
  engine-availability-only:
    runs-on: windows-latest
    steps:
      - name: Report engine availability (not compilation or packaging)
        shell: pwsh
        run: |
          $engines = @(Get-ChildItem 'C:\Program Files\Epic Games' -Directory -ErrorAction SilentlyContinue | Where-Object { Test-Path (Join-Path $_.FullName 'Engine\Build\BatchFiles\Build.bat') })
          "Engine installations found: $($engines.Count). UE compilation, automation, packaging and playtest: NOT RUN." | Out-File -Append $env:GITHUB_STEP_SUMMARY
