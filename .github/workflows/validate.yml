name: EIDOLON CI
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate project manifest and source
        run: python3 scripts/validate_source.py
      - name: Validate the First Descent layouts
        run: |
          python3 scripts/create_valdris_prologue.py --validate
          python3 scripts/create_first_descent_floor.py --validate
      - name: Run standalone progression tests
        shell: bash
        run: |
          set -euo pipefail
          for suite in first_descent_policy world_access first_descent_interaction_range; do
            c++ -std=c++17 -Wall -Wextra -Werror -pedantic "tests/$suite.cpp" -o "$RUNNER_TEMP/$suite"
            "$RUNNER_TEMP/$suite"
          done
  windows-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check for Unreal Engine and disk capacity
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem
          $engines = @(Get-ChildItem 'C:\Program Files\Epic Games' -Directory -ErrorAction SilentlyContinue | Where-Object { Test-Path (Join-Path $_.FullName 'Engine\Build\BatchFiles\Build.bat') })
          if ($engines.Count -eq 0) {
            Write-Host '::notice::Unreal Engine unavailable on this hosted runner. No Windows binary produced.'
            'No Unreal Engine available; source validation only.' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          } else {
            & ./scripts/Package-Windows.ps1 -EngineRoot $engines[0].FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload Windows demo when packaged
        uses: actions/upload-artifact@v4
        with:
          name: Eidolon-Windows-Demo
          path: Saved/Distribution/Windows/
          if-no-files-found: ignore
          retention-days: 14
